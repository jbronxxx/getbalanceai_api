[pytest]
asyncio_default_fixture_loop_scope = function
# Атрибут Field(), который pydantic игнорирует в этом месте (например, exclude у поля тела запроса), — ошибка:
# на проде такое предупреждение шумело в журнале на каждый /sync
filterwarnings =
    error::pydantic.warnings.UnsupportedFieldAttributeWarning
