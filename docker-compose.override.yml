# Только для локальной разработки: docker compose подхватывает этот файл автоматически,
# а прод запускается с явными -f docker-compose.yml -f docker-compose.prod.yml и его не читает.
# Каталог проекта монтируется в контейнер, чтобы, например, alembic revision писал миграции на хост.
services:
  api:
    volumes:
      - .:/app
