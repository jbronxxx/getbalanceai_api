# Ограничение частоты запросов к публичным страницам: ключ задан только для /privacy, /terms, /delete-account,
# для остальных путей ключ пустой и лимит не применяется (API ограничивается на уровне приложения)
map $uri $public_pages_limit_key {
    default "";
    ~^/(privacy|terms|delete-account)/?$ $binary_remote_addr;
}

limit_req_zone $public_pages_limit_key zone=public_pages:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.getbalanceai.app grafana.getbalanceai.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getbalanceai.app;

    # Убедитесь, что пути совпадают с вашим доменом, когда Certbot сгенерирует сертификаты
    ssl_certificate /etc/letsencrypt/live/api.getbalanceai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getbalanceai.app/privkey.pem;

    location / {
        limit_req zone=public_pages burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Grafana доступна только по HTTPS через поддомен; порт 3000 контейнера опубликован лишь на 127.0.0.1
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.getbalanceai.app;

    ssl_certificate /etc/letsencrypt/live/grafana.getbalanceai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.getbalanceai.app/privkey.pem;

    # Имя upstream резолвится при запросе через DNS Docker, поэтому nginx стартует и без запущенной Grafana
    resolver 127.0.0.11 valid=30s;

    location / {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
