# Не раскрываем версию nginx в заголовке Server и на страницах ошибок
server_tokens off;

# Ограничение частоты запросов к публичным страницам: ключ задан только для /privacy, /terms, /delete-account,
# для остальных путей ключ пустой и лимит не применяется (API ограничивается на уровне приложения)
map $uri $public_pages_limit_key {
    default "";
    ~^/(privacy|terms|delete-account)/?$ $binary_remote_addr;
}

limit_req_zone $public_pages_limit_key zone=public_pages:10m rate=5r/s;

# Лимит для ресурсов за basic auth (Grafana, Swagger): замедляет перебор паролей;
# запас burst рассчитан на загрузку дашборда Grafana, который делает десятки запросов разом
limit_req_zone $binary_remote_addr zone=protected:10m rate=10r/s;

# Запросы по IP или с чужим Host отклоняются: сервисы отвечают только на свои домены
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.getbalanceai.app grafana.getbalanceai.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getbalanceai.app;

    # Убедитесь, что пути совпадают с вашим доменом, когда Certbot сгенерирует сертификаты
    ssl_certificate /etc/letsencrypt/live/api.getbalanceai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getbalanceai.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Метрики Prometheus читает напрямую с api:8000 внутри сети Docker; снаружи они закрыты
    location = /metrics {
        deny all;
    }

    # Swagger, ReDoc и схема OpenAPI — только для команды, по учёткам из htpasswd
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        auth_basic "GetBalanceAI API docs";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=protected burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Логин/пароль basic auth не передаём в приложение
        proxy_set_header Authorization "";
    }

    location / {
        limit_req zone=public_pages burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Grafana доступна только по HTTPS через поддомен и за basic auth; порт 3000 контейнера опубликован лишь на 127.0.0.1
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.getbalanceai.app;

    ssl_certificate /etc/letsencrypt/live/grafana.getbalanceai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.getbalanceai.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Имя upstream резолвится при запросе через DNS Docker, поэтому nginx стартует и без запущенной Grafana
    resolver 127.0.0.11 valid=30s;

    location / {
        auth_basic "GetBalanceAI monitoring";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=protected burst=100 nodelay;
        limit_req_status 429;

        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana трактует заголовок Basic как попытку входа своей учёткой и отвечает 401, поэтому не передаём его
        proxy_set_header Authorization "";

        # WebSocket для Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
