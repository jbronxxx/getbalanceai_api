server {
    listen 80;
    listen [::]:80;
    server_name api.getbalanceai.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getbalanceai.app;

    # Убедитесь, что пути совпадают с вашим доменом, когда Certbot сгенерирует сертификаты
    ssl_certificate /etc/letsencrypt/live/api.getbalanceai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getbalanceai.app/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
