services:
  nginx:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      # Учётки basic auth для Grafana и Swagger; файл создаётся на сервере вручную и не хранится в git
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - api
    # certbot обновляет сертификат в общем томе, но nginx читает его только при старте или reload:
    # перечитываем конфигурацию раз в 6 часов, иначе после renew до истечения работал бы старый сертификат
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    restart: unless-stopped

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.getbalanceai.app

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  certbot_www:
  certbot_certs:
