name: Deploy to Production

'on':
  # Деплой только после успешного CI на main (workflow "CI" из main.yml) либо вручную
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

# Не допускаем параллельных деплоев на один сервер
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # Создаем или обновляем .env файл из секрета GitHub (если секрет задан)
          if [ -n "$PROD_ENV_FILE" ]; then
            printf '%s\n' "$PROD_ENV_FILE" | $SSH_CMD "$SSH_USER@$SSH_HOST" "cat > /opt/getbalanceai_api/.env"
          fi

          # Выполняем деплой на сервере
          $SSH_CMD "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /opt/getbalanceai_api

            # Обновляем код
            git pull origin main

            # Снимаем бэкап БД перед миграциями: downgrade части миграций необратимо теряет данные,
            # поэтому откат выполняется восстановлением этой копии. При ошибке бэкапа деплой останавливается (set -e)
            ./scripts/backup_db.sh predeploy

            # Применяем миграции базы данных перед запуском сервисов
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm api alembic upgrade head

            # Пересобираем образ api и всегда пересоздаём его контейнер: код читается gunicorn только при старте,
            # поэтому без пересоздания процесс продолжает работать на старой версии
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --no-deps --force-recreate api

            # Поднимаем остальные сервисы (пересоздаются только те, у кого изменился образ или конфигурация)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Применяем конфигурацию Nginx без простоя (при ошибке синтаксиса деплой завершится с ошибкой, старый конфиг продолжит работать)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # Очищаем старые неиспользуемые образы Docker для экономии места
            docker image prune -f
          EOF
