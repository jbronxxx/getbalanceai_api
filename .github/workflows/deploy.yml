name: Deploy to Production

'on':
  # Деплой только после успешного CI на main (workflow "CI" из main.yml) либо вручную
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

# Не допускаем параллельных деплоев на один сервер
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          # Без отпечатка сервера деплой не выполняем: иначе подключение шло бы без проверки хоста (MITM)
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Не задан секрет SSH_KNOWN_HOSTS (см. ssh-keyscan в документации деплоя)" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # Создаем или обновляем .env файл из секрета GitHub (если секрет задан)
          if [ -n "$PROD_ENV_FILE" ]; then
            printf '%s\n' "$PROD_ENV_FILE" | $SSH_CMD "$SSH_USER@$SSH_HOST" "cat > /opt/getbalanceai_api/.env"
          fi

          # Выполняем деплой на сервере. Скрипт приходит через stdin (heredoc), а docker compose run/exec по умолчанию
          # читают stdin и забирают остаток скрипта себе: деплой молча завершается с кодом 0. Поэтому всем командам,
          # которые запускают docker compose run/exec (в том числе через scripts/), передаётся </dev/null
          $SSH_CMD "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /opt/getbalanceai_api

            # Обновляем код
            git pull origin main

            # Учётки basic auth для Grafana и Swagger хранятся только на сервере. Без файла Docker смонтировал бы
            # на его месте пустой каталог, поэтому останавливаем деплой до любых изменений
            if [ ! -f nginx/htpasswd ]; then
              echo "Нет файла nginx/htpasswd: создайте учётки basic auth (см. README, раздел Мониторинг)" >&2
              exit 1
            fi

            # Снимаем бэкап БД перед миграциями: downgrade части миграций необратимо теряет данные,
            # поэтому откат выполняется восстановлением этой копии. При ошибке бэкапа деплой останавливается (set -e)
            ./scripts/backup_db.sh predeploy </dev/null

            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            # Имена совпадают с image сервиса api в docker-compose.yml
            API_IMAGE=getbalanceai-api:latest
            ROLLBACK_IMAGE=getbalanceai-api:rollback

            # Запоминаем текущий образ api до сборки: build перевешивает тег на новый образ, и откатиться было бы не на что.
            # Отдельный тег защищает образ от docker image prune; на первом деплое образа ещё нет
            if docker image inspect "$API_IMAGE" >/dev/null 2>&1; then
              docker tag "$API_IMAGE" "$ROLLBACK_IMAGE"
            fi

            # Сначала собираем образ api: run не пересобирает образ, и миграции выполнились бы старым кодом
            $DC build api

            # Применяем миграции базы данных новым образом до перезапуска сервисов
            $DC run --rm -T api alembic upgrade head </dev/null

            # Всегда пересоздаём контейнер api: код читается gunicorn только при старте,
            # поэтому без пересоздания процесс продолжает работать на старой версии
            $DC up -d --no-deps --force-recreate api

            # Ждём healthcheck нового контейнера (start_period 30 с + 3 неудачные проверки по 10 с укладываются в 90 с).
            # Если он не стал healthy, возвращаем предыдущий образ и завершаем деплой с ошибкой. Миграции при этом
            # не откатываются: схема должна оставаться совместимой с прошлой версией кода (двухфазное удаление колонок),
            # иначе откат выполняется восстановлением predeploy-копии БД
            API_STATUS=starting
            for _ in $(seq 1 45); do
              API_STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$($DC ps -q api)" 2>/dev/null || echo missing)
              [ "$API_STATUS" = "starting" ] || break
              sleep 2
            done
            if [ "$API_STATUS" != "healthy" ]; then
              echo "Контейнер api не прошёл healthcheck (статус: $API_STATUS)" >&2
              $DC logs --tail 100 api >&2
              if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
                docker tag "$ROLLBACK_IMAGE" "$API_IMAGE"
                $DC up -d --no-deps --force-recreate api
                echo "api откатан на предыдущий образ" >&2
              fi
              exit 1
            fi

            # Поднимаем остальные сервисы (пересоздаются только те, у кого изменился образ или конфигурация)
            $DC up -d

            # Применяем конфигурацию Nginx без простоя (при ошибке синтаксиса деплой завершится с ошибкой, старый конфиг продолжит работать)
            $DC exec -T nginx nginx -t </dev/null
            $DC exec -T nginx nginx -s reload </dev/null

            # Очищаем старые неиспользуемые образы Docker для экономии места
            docker image prune -f
          EOF
