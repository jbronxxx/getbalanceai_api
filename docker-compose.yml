services:
  api:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build: .
    # По умолчанию API доступен только с хоста; снаружи — через nginx. Для теста с телефона в LAN: APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Общие счётчики rate limiting для всех воркеров gunicorn
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped



  db:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_pass}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-finance_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s

  loki:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    # default — отправка в Loki, docker-api — обнаружение контейнеров через прокси вместо docker.sock
    networks:
      - default
      - docker-api
    restart: unless-stopped
    depends_on:
      - loki
      - docker-socket-proxy

  # Docker API только на чтение для promtail и cadvisor: контейнеры, сети, сведения о демоне. Сокет с :ro всё равно
  # даёт полный API (запуск контейнеров, exec) — прокси пропускает лишь разрешённые GET-эндпоинты, POST запрещён
  docker-socket-proxy:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - INFO=1
      - EVENTS=0
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped

  grafana:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/grafana:11.6.16
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  prometheus:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:v2.51.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  cadvisor:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    # Без privileged и /dev/kmsg: метрики CPU, памяти и сети читаются из cgroup и /rootfs, а события OOM
    # из журнала ядра дашборды не используют. Docker API — через прокси вместо docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - -machine_id_file=/rootfs/var/lib/machine-id
      - -docker_only=true
      - -docker=tcp://docker-socket-proxy:2375
      - -housekeeping_interval=10s
    networks:
      - default
      - docker-api
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
networks:
  # Изолированная сеть без выхода наружу: прокси Docker API доступен только promtail и cadvisor
  docker-api:
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

