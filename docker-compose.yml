services:
  api:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build: .
    # Явное имя образа: деплой держит рядом тег предыдущей версии (getbalanceai-api:rollback) для отката
    image: getbalanceai-api:latest
    # По умолчанию API доступен только с хоста; снаружи — через nginx. Для теста с телефона в LAN: APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Общие счётчики rate limiting для всех воркеров gunicorn
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Статус health ждёт деплой после пересоздания контейнера: unhealthy означает откат на предыдущий образ.
    # /health отвечает 503 при недоступной БД или Redis, urlopen на этом бросает исключение — проверка не проходит
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_pass}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-finance_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # Потолок памяти на сервере 4 ГБ. noeviction: при заполнении запись отклоняется, а не вытесняет ключи —
    # вытеснение могло бы удалить отозванные jti и вернуть к жизни отозванные токены
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  loki:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/loki:3.7.9
    ports:
      - "127.0.0.1:3100:3100"
    # Чанки, индекс и состояние компактора — в томе loki_data: без него пересоздание контейнера
    # (обновление образа, деплой) стирало логи раньше заявленного срока хранения 30 дней
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Сборщик логов контейнеров (замена promtail, у которого закончилась поддержка). Позиции чтения хранятся в томе
  # alloy_data: после перезапуска логи дочитываются с места остановки, без дублей и пропусков
  alloy:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/alloy:v1.20.1
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    # default — отправка в Loki, docker-api — обнаружение контейнеров через прокси вместо docker.sock
    networks:
      - default
      - docker-api
    restart: unless-stopped
    depends_on:
      - loki
      - docker-socket-proxy

  # Docker API только на чтение для alloy и cadvisor: контейнеры, сети, сведения о демоне. Сокет с :ro всё равно
  # даёт полный API (запуск контейнеров, exec) — прокси пропускает лишь разрешённые GET-эндпоинты, POST запрещён
  docker-socket-proxy:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - INFO=1
      - EVENTS=0
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped

  grafana:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/grafana:11.6.16
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  prometheus:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  cadvisor:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    # Без privileged и /dev/kmsg: метрики CPU, памяти и сети читаются из cgroup и /rootfs, а события OOM
    # из журнала ядра дашборды не используют. Docker API — через прокси вместо docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # machine_id_file не задаётся: cAdvisor сам добавляет префикс /rootfs к путям по умолчанию
    # (/etc/machine-id, /var/lib/dbus/machine-id), а явный /rootfs/... превращался в /rootfs/rootfs/...
    command:
      - -docker_only=true
      - -docker=tcp://docker-socket-proxy:2375
      - -housekeeping_interval=10s
    networks:
      - default
      - docker-api
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
  # Метрики хоста (CPU, RAM, своп, load, диск): cAdvisor с docker_only видит только контейнеры.
  # Корневая ФС хоста — только на чтение; порт не публикуется, Prometheus читает его по сети Docker
  node-exporter:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  # Метрики Postgres изнутри: соединения по состояниям, транзакции, блокировки, попадания в кэш
  postgres-exporter:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-finance_db}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-finance_user}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-finance_pass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Метрики Redis: память относительно maxmemory (при noeviction заполнение ломает запись), команды, клиенты
  redis-exporter:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Изолированная сеть без выхода наружу: прокси Docker API доступен только alloy и cadvisor
  docker-api:
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:

